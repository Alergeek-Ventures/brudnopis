id: forbid-silent-catch-ts
message: "Silent catch blocks are not allowed. Log the error (console.error) or re-throw it"
severity: error
language: typescript
rule:
  kind: catch_clause
  not:
    has:
      kind: statement_block
      has:
        any:
          - kind: expression_statement
          - kind: return_statement
          - kind: throw_statement
          - kind: variable_declaration
          - kind: if_statement
